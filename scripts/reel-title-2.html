<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0; background: transparent; }

    /* Transparent overlay composited over the rainbow-church PHOTO scene. */
    .frame {
      width: 1080px;
      height: 1920px;
      position: relative;
      font-family: 'Open Sans', Arial, sans-serif;
      background: linear-gradient(180deg,
        rgba(15,31,92,.55) 0%,
        rgba(15,31,92,.34) 32%,
        rgba(15,31,92,.55) 64%,
        rgba(15,31,92,.92) 100%);
    }
    .inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 250px 80px 300px;
      gap: 30px;
    }
    .chip {
      background: rgba(232,98,42,.96);
      border-radius: 100px;
      padding: 18px 40px;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 900; font-size: 36px;
      letter-spacing: 4px; text-transform: uppercase; color: #fff;
    }
    h1 {
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 900; font-size: 100px; line-height: .98;
      letter-spacing: -2px; color: #fff;
      text-shadow: 0 3px 22px rgba(0,0,0,.55);
    }
    .keynote {
      font-family: 'Open Sans', Arial, sans-serif;
      font-weight: 600; font-size: 38px; line-height: 1.4;
      color: rgba(255,255,255,.94); max-width: 760px;
      text-shadow: 0 2px 14px rgba(0,0,0,.5);
    }
    .keynote b { font-family: 'Montserrat', Arial, sans-serif; font-weight: 800; color: #fff; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="inner">
      <div class="chip">Free Friday Night</div>
      <h1>All Are<br>Welcome</h1>
      <p class="keynote">Featuring keynote speaker<br><b>Tommy Woodard</b> · The Skit Guys</p>
    </div>
  </div>
</body>
</html>
