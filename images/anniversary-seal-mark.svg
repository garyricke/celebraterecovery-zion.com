<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="CR 20 Years">
  <!-- Disc -->
  <circle cx="50" cy="50" r="49" fill="#0F1F5C"/>
  <circle cx="50" cy="50" r="46.5" fill="none" stroke="#E8622A" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="43.5" fill="#1E3A8A"/>

  <!-- C|R glyph -->
  <g transform="translate(50,26)">
    <circle r="9" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <text y="0" font-family="Montserrat,'Arial Black',sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">C</text>
    <line x1="-7.2" y1="1" x2="7.2" y2="1" stroke="#ffffff" stroke-width="0.9"/>
    <text y="9.5" font-family="Montserrat,'Arial Black',sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">R</text>
  </g>

  <!-- 20 -->
  <text x="50" y="74" font-family="Montserrat,'Arial Black',sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">20</text>

  <!-- YEARS -->
  <text x="50" y="86" font-family="Montserrat,sans-serif" font-weight="800" font-size="7" fill="#E8622A" text-anchor="middle" letter-spacing="2">YEARS</text>
</svg>
