<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-label="20 Years of Hope and Healing – Zion Lutheran, Fairbanks AK">
  <!-- Outer crest -->
  <path d="M 30 30 L 330 30 L 330 280 Q 330 360 180 400 Q 30 360 30 280 Z" fill="#1E3A8A" stroke="#E8622A" stroke-width="3"/>
  <!-- Inner border -->
  <path d="M 45 45 L 315 45 L 315 278 Q 315 350 180 385 Q 45 350 45 278 Z" fill="none" stroke="#E8622A" stroke-width="1" opacity="0.55"/>

  <!-- Cross at top -->
  <g transform="translate(180,82)">
    <rect x="-3" y="-24" width="6" height="48" fill="#E8622A"/>
    <rect x="-14" y="-8" width="28" height="6" fill="#E8622A"/>
  </g>

  <!-- Aurora stars near cross -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="245" cy="72" r="1.5" opacity="0.6"/>
    <circle cx="280" cy="100" r="1.2" opacity="0.4"/>
  </g>

  <!-- Mountains -->
  <g transform="translate(0,140)">
    <!-- Back range -->
    <path d="M 45 110 L 110 50 L 155 90 L 200 30 L 250 80 L 315 110 L 315 130 L 45 130 Z" fill="#0F1F5C"/>
    <!-- Snow caps -->
    <path d="M 96 64 L 110 50 L 124 64 L 116 70 L 110 65 L 104 70 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 188 44 L 200 30 L 212 44 L 206 50 L 200 45 L 194 50 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Front range -->
    <path d="M 45 130 L 90 90 L 130 115 L 175 80 L 220 110 L 270 95 L 315 130 Z" fill="#ffffff" opacity="0.10"/>
  </g>

  <!-- Big 20 -->
  <text x="180" y="225" font-family="Montserrat, 'Arial Black', sans-serif" font-weight="900" font-size="110" fill="#ffffff" text-anchor="middle">20</text>

  <!-- Banner ribbon -->
  <g transform="translate(180,320)">
    <path d="M -135 -18 L 135 -18 L 150 0 L 135 18 L -135 18 L -120 0 Z" fill="#E8622A"/>
    <path d="M -150 -10 L -135 -18 L -135 18 L -150 10 Z" fill="#0F1F5C" opacity="0.45"/>
    <path d="M 150 -10 L 135 -18 L 135 18 L 150 10 Z" fill="#0F1F5C" opacity="0.45"/>
    <text y="5" font-family="Montserrat, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="3">YEARS OF HOPE &amp; HEALING</text>
  </g>

  <!-- Location -->
  <text x="180" y="362" font-family="Montserrat, sans-serif" font-weight="700" font-size="11.5" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">ZION LUTHERAN  •  FAIRBANKS, AK</text>
  <text x="180" y="380" font-family="Montserrat, sans-serif" font-weight="600" font-size="9" fill="#E8622A" text-anchor="middle" letter-spacing="3">EST. 2006  ·  ANNIVERSARY 2026</text>
</svg>
